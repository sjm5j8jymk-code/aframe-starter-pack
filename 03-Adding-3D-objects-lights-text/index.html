<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
       <a-assets>
        <a-asset-item id="butterfly" src="Assets/butterfly.obj"></a-asset-item>
        <a-asset-item id="butterfly2" src="Assets/_butterfly2.obj"></a-asset-item>
        <a-asset-item id="butterfly3" src="Assets/butterfly3.obj"></a-asset-item>
      </a-assets>

      <a-obj-model src="#butterfly" position="0 0 -5" color="pink"></a-obj-model>
      <a-obj-model src="#butterfly2" position="0 0 -5" scale="0.01 0.01 0.01" ></a-obj-model>
      <a-obj-model src="#butterfly3" position="0 0 -5" scale="0.01 0.01 0.01" ></a-obj-model>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
