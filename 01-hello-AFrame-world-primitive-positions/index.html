<!DOCTYPE html>
<html>

     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>

  <body>
     <a-scene>
      <!-- <a-box position="-3 0.5 -3" rotation="10 100 10" color="#DCD0FF"></a-box> -->

      <a-sphere position="0 3.0 -5" radius="1." color="#FFFFFF"></a-sphere>
      <a-sphere position="0 1.2 -5" radius="1.5" color="#FFFFFF"></a-sphere>
      <a-cylinder position="0 5 -5" radius="0.5" height="1.6" color="#FF83C1"></a-cylinder> -->

      <a-sphere position="-3.53 3 -5" radius="1." color="#FFFFFF"></a-sphere>

 <a-cylinder position="-3.5 5 -5" radius="0.5" height="1.6" color="#B19CD9"></a-cylinder> -->

      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="400" height="400" color="#FFFFFFF"></a-plane>
      
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: moon; dressingAmount: 500"></a-entity>
